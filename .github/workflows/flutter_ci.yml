name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    name: Analizar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar codigo
        run: flutter analyze

      - name: Ejecutar pruebas
        run: |
          flutter test --reporter expanded 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Resultado de flutter test'
            echo '```text'
            tail -n 200 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            tail -n 45 test-output.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"
