name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-apk:
    name: Generar APK universal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      - name: Build APK release
        run: |
          flutter build apk --release 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Resultado de flutter build apk'
            echo '```text'
            tail -n 250 build-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 80 build-output.txt \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::error::${msg}"
          fi
          exit "$status"

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: econauta-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
